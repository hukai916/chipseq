name: dedup_multimapper
description: |
  Deduplicate PCR duplicates in BAM files with multi-mapped reads. Read groups are
  compared by overlapping fragment-coordinate signatures (not Picard coordinate-only
  marking). Implemented by dedup_multimapper.py (pysam); output is coordinate-sorted
  by default.
keywords:
  - deduplication
  - multimapping
  - multimapper
  - pcr
  - duplicates
  - bam
tools:
  - dedup_multimapper:
      description: |
        Local Python script for multi-mapper-aware duplicate detection using fragment
        signature overlap across read groups.
      licence: ["MIT"]
  - pysam:
      description: |
        Python interface for SAM/BAM/CRAM files; used for streaming I/O and sorting.
      homepage: https://github.com/pysam-developers/pysam
      documentation: https://pysam.readthedocs.io/
      licence: ["MIT"]
      identifier: biotools:pysam
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - reads:
        type: file
        description: |
          Input BAM (name-sorted or coordinate-sorted; name-sorted automatically if
          needed). Must contain multi-mapped alignments when applicable.
        pattern: "*.{bam}"
        ontologies: []
  - - meta2:
        type: map
        description: |
          Groovy Map containing reference information (workflow interface; unused by
          dedup_multimapper.py for BAM input)
          e.g. [ id:'genome' ]
    - fasta:
        type: file
        description: Reference genome FASTA (optional; retained for subworkflow compatibility)
        pattern: "*.{fasta,fa}"
        ontologies: []
  - - meta3:
        type: map
        description: |
          Groovy Map containing reference information (workflow interface; unused by
          dedup_multimapper.py for BAM input)
          e.g. [ id:'genome' ]
    - fai:
        type: file
        description: Reference genome FASTA index (optional; retained for subworkflow compatibility)
        pattern: "*.{fai}"
        ontologies: []
output:
  bam:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.bam":
          type: file
          description: |
            Deduplicated BAM (dropped or marked with 0x400 per task.ext.args / --mode)
          pattern: "*.{bam}"
          ontologies: []
  bai:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.bai":
          type: file
          description: |
            Not produced by this process; BAM indexing is performed downstream by
            SAMTOOLS_INDEX in BAM_MARKDUPLICATES_MULTIMAPPER
          pattern: "*.{bai}"
          ontologies: []
  cram:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.cram":
          type: file
          description: Optional CRAM output if task.ext.suffix is cram (not used by default)
          pattern: "*.{cram}"
          ontologies: []
  metrics:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.txt":
          type: file
          description: |
            Duplicate-detection log from dedup_multimapper.py (--log); includes per-group overlap table and run summary
          pattern: "*.{txt}"
          ontologies: []
  versions_dedup_multimapper:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - dedup_multimapper:
          type: string
          description: The tool name
      - "dedup_multimapper.py --version 2>&1 | sed -n 's/.*Version://p'":
          type: string
          description: The command used to generate the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - dedup_multimapper:
          type: string
          description: The tool name
      - "dedup_multimapper.py --version 2>&1 | sed -n 's/.*Version://p'":
          type: string
          description: The command used to generate the version of the tool
authors:
  - "@kaihu"
